[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmai"
version = "0.1.0"
description = "DungeonMaster AI - Adaptive Tabletop RPG Engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "httpx>=0.27",
    "jinja2>=3.1",
    "websockets>=13",
    "rich>=13.7",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.1"]
mcp = ["mcp>=1.2"]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "pyinstaller>=6.10"]

[project.scripts]
dmai = "dmai.cli.main:run"
dmai-desktop = "dmai.desktop.app:main"

[tool.setuptools.packages.find]
include = ["dmai*"]

[tool.setuptools.package-data]
"dmai.web" = ["**/*"]
"dmai.desktop" = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "llm: tests that call a real language model (deselected by default)",
]
asyncio_mode = "auto"
